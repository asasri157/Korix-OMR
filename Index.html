    body { font-family: 'Poppins', system-ui, -apple-system, sans-serif; }

    .shadow-xs { box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); }
    .backdrop-blur-xs { backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }

      body * { visibility: hidden; }
      #printable-container, #printable-container * { visibility: visible; }

        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        margin: 0;
        padding: 0;

        <button id="btn-header-hamburger" onclick="toggleTeacherDrawer()" class="hidden p-2 -ml-1 text-slate-700 hover:text-blue-600 hover:bg-slate-100 rounded-xl transition items-center justify-center shrink-0 border border-slate-200/80 shadow-2xs" title="Menu Navigasi Guru">

            K

          <div class="min-w-0 pr-1 sm:pr-2">
            <span class="text-base sm:text-lg font-bold tracking-tight text-slate-900 truncate block" id="header-app-name">
              KORIX <span class="text-blue-600">OMR</span>
            </span>
            <p class="text-[10px] sm:text-[11px] text-slate-500 truncate max-w-[120px] sm:max-w-[200px] md:max-w-xs font-medium" id="header-sub-info">
              Sistem Koreksi Lembar Jawaban Cerdas
            </p>
          </div>
        </div>

        <!-- Desktop Teacher Nav Items (Strictly Left-aligned) -->
        <nav id="header-teacher-nav" class="hidden lg:flex items-center gap-1 xl:gap-1.5 ml-2 pl-3 border-l border-slate-200 overflow-x-auto py-1">
          <!-- Rendered dynamically by renderNav() -->
        </nav>
      </div>

      <div id="nav-actions" class="flex items-center gap-2 sm:gap-3 shrink-0">
        <!-- Rendered by JS -->
      </div>
    </div>
  </header>

  <!-- SLIDE-OVER DRAWER GURU (HAMBURGER DRAWER) -->
  <div id="teacher-drawer-wrapper" class="fixed inset-0 z-50 overflow-hidden hidden" role="dialog" aria-modal="true">
    <div class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs transition-opacity" onclick="closeTeacherDrawer()"></div>
    <div class="fixed inset-y-0 left-0 max-w-full flex">

        <div id="teacher-drawer-content" class="flex flex-col h-full"></div>
      </aside>
    </div>
  </div>

    <div id="loading-spinner" class="py-20 text-center">
      <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-blue-600 border-t-transparent"></div>
      <p class="mt-3 text-slate-600 text-sm">Memuat aplikasi KORIX OMR...</p>
    </div>
  </main>

  <!-- PRINT CONTAINER (Hidden in screen, visible in print) -->
  <div id="printable-container" class="hidden"></div>

    <p id="footer-text">© 2026 KORIX OMR - Solusi Digitalisasi Penilaian Berbasis Google Apps Script & Google Sheets.</p>

    // Floating In-App Toast Notification
    function showToast(message, type) {
      var container = document.getElementById('toast-container');
      if (!container) {
        container = document.createElement('div');
        container.id = 'toast-container';
        container.className = 'fixed top-4 right-4 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none px-3';
        document.body.appendChild(container);
      }

      var bg = 'bg-slate-900 text-white';
      var iconHtml = ICONS.sparkles || '';
      if (type === 'success') {
        bg = 'bg-emerald-600 text-white shadow-lg shadow-emerald-600/20';
        iconHtml = ICONS.checkCircle2 || ICONS.check;
      } else if (type === 'error') {
        bg = 'bg-rose-600 text-white shadow-lg shadow-rose-600/20';
        iconHtml = ICONS.alert;
      } else if (type === 'warning') {
        bg = 'bg-amber-600 text-white shadow-lg shadow-amber-600/20';
        iconHtml = ICONS.alertTriangle || ICONS.alert;
      } else if (type === 'info') {
        bg = 'bg-blue-600 text-white shadow-lg shadow-blue-600/20';
        iconHtml = ICONS.sparkles;
      }

      var toast = document.createElement('div');
      toast.className = 'pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-xl text-xs font-semibold shadow-lg transition-all duration-300 transform translate-y-0 opacity-100 ' + bg;
      toast.innerHTML = '<span class="shrink-0">' + iconHtml + '</span><span class="flex-1">' + message + '</span>';
      container.appendChild(toast);

      setTimeout(function() {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-10px)';
        setTimeout(function() { toast.remove(); }, 350);
      }, 3500);
    }

    // Helper panggil Google Apps Script atau fallback local

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        var runner = google.script.run
          .withSuccessHandler(function(res) { if (onSuccess) onSuccess(res); })
          .withFailureHandler(function(err) {
            console.error("GAS Error:", err);
            if (onError) onError(err);
            else showToast("Kesalahan: " + (err.message || err), "error");
          });
        if (args && args.length > 0) runner[funcName].apply(runner, args);
        else runner[funcName]();
      } else {
        // Fallback demo local simulation
        console.warn("GAS belum terhubung, menggunakan mode simulasi browser.");
        if (onSuccess) onSuccess(null);
      }
    }

    // Evaluasi otomatis masa aktif paket
    function evaluateUserExpiration(user) {
      if (!user) return null;
      if (user.role === 'superadmin' || user.paket === 'Unlimited' || user.tanggalBerakhir === 'Unlimited') {
        user.paketStatus = 'Aktif';
        return user;
      }
      if (user.tanggalBerakhir) {
        var today = new Date().toISOString().split('T')[0];
        if (today > user.tanggalBerakhir) {
          user.paketStatus = 'Expired';
        } else {
          user.paketStatus = 'Aktif';
        }
      }
      return user;
    }

    // Mengambil dan menyelaraskan daftar user dengan auto-expiry
    function getStoredUsers() {
      var list = JSON.parse(SafeStorage.getItem('korix_users') || '[]');
      var updated = list.map(function(u) { return evaluateUserExpiration(u); });
      SafeStorage.setItem('korix_users', JSON.stringify(updated));
      return updated;
    }

      var savedAuth = SafeStorage.getItem('korix_auth_user');
      if (savedAuth) {
        try {

          AppState.currentUser = evaluateUserExpiration(parsed);
          SafeStorage.setItem('korix_auth_user', JSON.stringify(AppState.currentUser));
        } catch(e) {}
      }

      // Render immediately with local/cached data
      renderApp();

      // If running inside Google Apps Script, sync live settings and data in background
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        try {
          google.script.run
            .withSuccessHandler(function(cfg) {
              if (cfg && Object.keys(cfg).length > 0) {
                AppState.landing = Object.assign({}, AppState.landing, cfg);
                renderNav();

                if (AppState.currentUser && AppState.currentUser.role === 'superadmin') {
                  renderSuperAdmin();

              }
            })
            .getUsers();
        } catch(e) {
          console.warn("GAS background sync:", e);
        }
      }

    function toggleLoginPasswordVisibility() {
      var passInput = document.getElementById('input-password');
      var btn = document.getElementById('btn-login-toggle-eye');
      if (!passInput || !btn) return;
      isPasswordVisible = !isPasswordVisible;
      passInput.type = isPasswordVisible ? 'text' : 'password';
      btn.innerHTML = isPasswordVisible ? ICONS.eyeOff : ICONS.eye;
      showToast(isPasswordVisible ? 'Kata Sandi Ditampilkan' : 'Kata Sandi Disembunyikan', 'info');
    }

    function closeLoginModal() {
      var m = document.getElementById('login-modal-wrapper');
      if (m) m.remove();
    }


    function handleLogin(e) {
      e.preventDefault();
      var u = document.getElementById('input-username').value.trim();
      var p = document.getElementById('input-password').value.trim();
      var errBox = document.getElementById('login-error-box');
      var errText = document.getElementById('login-error-text');

      function showError(msg) {
        if (errBox) {
          if (errText) errText.innerText = msg;
          errBox.classList.remove('hidden');
        }
        showToast('Login Gagal: ' + msg, 'error');
      }

      function onLoginSuccess(user) {
        user = evaluateUserExpiration(user);
        AppState.currentUser = user;
        SafeStorage.setItem('korix_auth_user', JSON.stringify(user));
        closeLoginModal();
        renderApp();
        showToast('Login Berhasil! Selamat datang, ' + user.nama, 'success');
      }

      // 1. Coba lewat Google Apps Script jika aktif di Web App
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(res) {
            if (res && res.success && res.user) {
              onLoginSuccess(res.user);
            } else {
              // Cek fallback lokal bila GAS mengembalikan gagal
              var users = getStoredUsers();
              var found = users.find(function(usr) {
                return usr.username.toLowerCase() === u.toLowerCase() && usr.password === p && usr.aktif;
              });
              if (found) {
                onLoginSuccess(found);
              } else {
                showError(res ? res.message : 'Username atau password tidak sesuai.');
              }
            }
          })
          .withFailureHandler(function(err) {
            var users = getStoredUsers();
            var found = users.find(function(usr) {
              return usr.username.toLowerCase() === u.toLowerCase() && usr.password === p && usr.aktif;
            });
            if (found) {
              onLoginSuccess(found);
            } else {
              showError('Gagal menghubungkan server. Silakan coba lagi.');
            }
          })
          .login(u, p);
      } else {
        // 2. Fallback Standalone / LocalStorage
        var users = getStoredUsers();
        var found = users.find(function(usr) {
          return usr.username.toLowerCase() === u.toLowerCase() && usr.password === p && usr.aktif;
        });

        if (found) {
          onLoginSuccess(found);
        } else {
          showError('Username atau password tidak sesuai, atau akun dinonaktifkan.');
        }
      }
    }

    function adminExtend(userId, paketType) {
      var users = getStoredUsers();
      var target = users.find(function(u) { return u.id === userId; });
      if (!target) return;

      var today = new Date();
      var todayStr = today.toISOString().split('T')[0];
      target.paket = paketType;
      target.paketStatus = 'Aktif';

      if (paketType === 'Unlimited') {
        target.tanggalBerakhir = 'Unlimited';
      } else {
        var days = (paketType === 'Bulanan' ? 30 : 365);
        var base = today;
        if (target.paketStatus === 'Aktif' && target.tanggalBerakhir && target.tanggalBerakhir !== 'Unlimited') {
          var prev = new Date(target.tanggalBerakhir);
          if (prev > today) base = prev;
        }
        base.setDate(base.getDate() + days);
        target.tanggalBerakhir = base.toISOString().split('T')[0];
      }

      SafeStorage.setItem('korix_users', JSON.stringify(users));
      renderSuperAdmin();
    }

    function handleCreateTeacher(e) {
      e.preventDefault();
      var nama = document.getElementById('new-tea-nama').value.trim();
      var user = document.getElementById('new-tea-user').value.trim();
      var pass = document.getElementById('new-tea-pass').value.trim();
      var paket = document.getElementById('new-tea-paket').value;

      var today = new Date();
      var todayStr = today.toISOString().split('T')[0];
      var end = 'Unlimited';
      if (paket === 'Bulanan') {
        today.setDate(today.getDate() + 30);
        end = today.toISOString().split('T')[0];
      } else if (paket === 'Tahunan') {
        today.setDate(today.getDate() + 365);
        end = today.toISOString().split('T')[0];
      }

      var users = getStoredUsers();
      users.push({
        id: 'usr-' + new Date().getTime(),
        username: user,
        password: pass,
        nama: nama,
        email: user + '@guru.sch.id',
        role: 'guru',
        aktif: true,
        createdAt: todayStr,
        paket: paket,
        paketStatus: 'Aktif',
        tanggalMulai: todayStr,
        tanggalBerakhir: end,
        namaSekolah: 'SMA NEGERI 1 NUSANTARA',
        alamatSekolah: 'Jl. Merdeka No. 45, Jakarta Pusat',
        teleponSekolah: '(021) 555-0192',
        logoSekolahUrl: 'https://images.unsplash.com/photo-1599305445671-ac291c95aaa9?w=160&auto=format&fit=crop&q=80'
      });

      SafeStorage.setItem('korix_users', JSON.stringify(users));
      document.getElementById('add-teacher-modal').remove();
      renderSuperAdmin();
    }

      renderApp();

    }

    // Toggle Password Visibility with SVG Icons
    function togglePassVisibility(inputId, btn) {
      var inp = document.getElementById(inputId);
      if (inp) {
        var isPass = inp.type === 'password';
        inp.type = isPass ? 'text' : 'password';
        if (btn) {
          btn.innerHTML = isPass ? ICONS.eyeOff : ICONS.eye;
          btn.title = isPass ? 'Sembunyikan password' : 'Lihat password';
        }
      }
    }

    // Real-time Password Confirmation Check
    function checkPasswordMatch() {
      var newPassEl = document.getElementById('input-new-pass');
      var confPassEl = document.getElementById('input-confirm-pass');
      var matchInd = document.getElementById('confirm-match-indicator');
      if (!newPassEl || !confPassEl || !matchInd) return;

      var newPass = newPassEl.value;
      var confPass = confPassEl.value;

      if (!confPass) {
        matchInd.className = 'text-[11px] mt-1 hidden';
        matchInd.innerHTML = '';
        return;
      }

      if (newPass === confPass) {
        matchInd.className = 'text-[11px] mt-1 text-emerald-600 font-medium block';
        matchInd.innerHTML = '✓ Konfirmasi password baru cocok!';
      } else {
        matchInd.className = 'text-[11px] mt-1 text-rose-600 font-medium block';
        matchInd.innerHTML = '✕ Konfirmasi belum sama dengan password baru.';
      }
    }

    function resetPasswordForm() {
      var box = document.getElementById('password-feedback-box');
      if (box) { box.className = 'hidden'; box.innerHTML = ''; }
      var matchInd = document.getElementById('confirm-match-indicator');
      if (matchInd) { matchInd.className = 'text-[11px] mt-1 hidden'; matchInd.innerHTML = ''; }
    }

    // Handle Ubah Password
    function handleChangePassword(e) {
      e.preventDefault();
      var user = AppState.currentUser;
      var oldPass = document.getElementById('input-old-pass').value.trim();
      var newPass = document.getElementById('input-new-pass').value.trim();
      var confPass = document.getElementById('input-confirm-pass').value.trim();
      var box = document.getElementById('password-feedback-box');

      box.classList.add('hidden');
      box.innerHTML = '';

      var users = getStoredUsers();
      var dbUser = users.find(function(u) { return u.id === user.id; });
      var knownOldPass = (dbUser && dbUser.password) ? dbUser.password : user.password;

      if (knownOldPass && oldPass !== knownOldPass) {
        box.className = 'p-4 bg-rose-50 border border-rose-200 text-rose-800 rounded-xl flex items-start gap-2.5 text-xs sm:text-sm animate-in fade-in block';
        box.innerHTML = `
          <div class="flex items-start gap-2.5">
            ${ICONS.alert}
            <div>
              <div class="font-bold">Gagal Mengubah Password</div>
              <div class="text-rose-700 text-xs mt-0.5">Password lama yang Anda masukkan tidak sesuai. Silakan periksa kembali.</div>
            </div>
          </div>
        `;
        return;
      }

      if (newPass.length < 6) {
        box.className = 'p-4 bg-rose-50 border border-rose-200 text-rose-800 rounded-xl flex items-start gap-2.5 text-xs sm:text-sm animate-in fade-in block';
        box.innerHTML = `
          <div class="flex items-start gap-2.5">
            ${ICONS.alert}
            <div>
              <div class="font-bold">Password Terlalu Pendek</div>
              <div class="text-rose-700 text-xs mt-0.5">Password baru harus memiliki minimal 6 karakter.</div>
            </div>
          </div>
        `;
        return;
      }

      if (newPass === oldPass) {
        box.className = 'p-4 bg-rose-50 border border-rose-200 text-rose-800 rounded-xl flex items-start gap-2.5 text-xs sm:text-sm animate-in fade-in block';
        box.innerHTML = `
          <div class="flex items-start gap-2.5">
            ${ICONS.alert}
            <div>
              <div class="font-bold">Password Sama</div>
              <div class="text-rose-700 text-xs mt-0.5">Password baru tidak boleh sama dengan password lama saat ini.</div>
            </div>
          </div>
        `;
        return;
      }

      if (newPass !== confPass) {
        box.className = 'p-4 bg-rose-50 border border-rose-200 text-rose-800 rounded-xl flex items-start gap-2.5 text-xs sm:text-sm animate-in fade-in block';
        box.innerHTML = `
          <div class="flex items-start gap-2.5">
            ${ICONS.alert}
            <div>
              <div class="font-bold">Konfirmasi Tidak Cocok</div>
              <div class="text-rose-700 text-xs mt-0.5">Konfirmasi password baru tidak cocok dengan password baru.</div>
            </div>
          </div>
        `;
        return;
      }

      // Update password locally and in localStorage
      user.password = newPass;
      var idx = users.findIndex(function(u) { return u.id === user.id; });
      if (idx !== -1) users[idx].password = newPass;
      SafeStorage.setItem('korix_users', JSON.stringify(users));
      SafeStorage.setItem('korix_auth_user', JSON.stringify(user));

      callGAS('changePassword', [user.id, oldPass, newPass], function(res) {
        if (res && res.success === false) {
          box.className = 'p-4 bg-rose-50 border border-rose-200 text-rose-800 rounded-xl flex items-start gap-2.5 text-xs sm:text-sm animate-in fade-in block';
          box.innerHTML = `
            <div class="flex items-start gap-2.5">
              ${ICONS.alert}
              <div>
                <div class="font-bold">Gagal Mengubah Password di Google Sheets</div>
                <div class="text-rose-700 text-xs mt-0.5">${res.message || 'Terjadi kesalahan sistem.'}</div>
              </div>
            </div>
          `;
          return;
        }
      });

      box.className = 'p-4 bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-xl flex items-start gap-2.5 text-xs sm:text-sm animate-in fade-in block';
      box.innerHTML = `
        <div class="flex items-start gap-2.5">
          ${ICONS.check}
          <div>
            <div class="font-bold">Password Berhasil Diperbarui!</div>
            <div class="text-emerald-700 text-xs mt-0.5">Kata sandi akun guru Anda telah diperbarui. Silakan gunakan password baru ini saat login.</div>
          </div>
        </div>
      `;

      document.getElementById('input-old-pass').value = '';
      document.getElementById('input-new-pass').value = '';
      document.getElementById('input-confirm-pass').value = '';
      var matchInd = document.getElementById('confirm-match-indicator');
      if (matchInd) { matchInd.className = 'text-[11px] mt-1 hidden'; matchInd.innerHTML = ''; }
    }

    // Modal Analisis Hasil Koreksi & Penanda Jawaban Salah
    function openDetailResultModal(resultId, filterTab) {
      var r = AppState.results.find(function(res) { return res.id === resultId; });
      if (!r) return;

      var exam = AppState.exams.find(function(e) { return e.id === r.examId; }) || AppState.exams[0];
      var questions = (exam && exam.questions && exam.questions.length > 0) ? exam.questions : [];
      var detected = r.jawabanTerdeteksi || {};

      var currentFilter = filterTab || 'all';

      var modal = document.createElement('div');
      modal.id = 'detail-result-modal-wrapper';
      modal.className = 'fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs overflow-y-auto';

      function renderModalContent(filter) {
        currentFilter = filter;
        var qListHtml = '';
        var wrongCount = 0;
        var correctCount = 0;
        var blankCount = 0;

        questions.forEach(function(q) {
          var userAns = detected[q.nomor];
          var isBlank = !userAns || userAns === '' || (Array.isArray(userAns) && userAns.length === 0);
          var isCorrect = false;

          if (!isBlank) {
            var correctKey = q.kunci;
            if (Array.isArray(correctKey)) {
              var uArr = (Array.isArray(userAns) ? userAns : [userAns]).sort();
              isCorrect = JSON.stringify(correctKey.sort()) === JSON.stringify(uArr);
            } else {
              isCorrect = String(userAns).toUpperCase().trim() === String(correctKey).toUpperCase().trim();
            }
          }

          if (isBlank) blankCount++;
          else if (isCorrect) correctCount++;
          else wrongCount++;

          if (currentFilter === 'wrong' && (isBlank || isCorrect)) return;
          if (currentFilter === 'correct' && !isCorrect) return;
          if (currentFilter === 'blank' && !isBlank) return;

          if (!isBlank && !isCorrect) {
            // Jawaban SALAH: Ditandai mencolok dengan border merah tebal & strikethrough
            qListHtml += `
              <div class="p-3.5 rounded-xl border-2 border-rose-400 bg-rose-50/80 shadow-2xs space-y-2">
                <div class="flex items-center justify-between">
                  <div class="flex items-center gap-2">
                    <span class="font-extrabold text-slate-900 text-xs">Nomor ${q.nomor}</span>
                    <span class="px-1.5 py-0.5 bg-slate-200 text-slate-700 text-[10px] font-bold uppercase rounded">${q.tipe}</span>
                    <span class="text-[11px] text-slate-500">Bobot: ${q.bobot || 5} poin</span>
                  </div>
                  <span class="px-2.5 py-0.5 bg-rose-600 text-white font-black text-[10px] rounded-full inline-flex items-center gap-1 shadow-2xs">

                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs pt-0.5">
                  <div class="p-2 bg-white rounded-lg border border-rose-200">
                    <span class="text-[10px] text-rose-700 font-bold block uppercase tracking-wider">Jawaban Siswa (Salah):</span>
                    <span class="text-sm font-black text-rose-600 line-through mt-0.5 block">${Array.isArray(userAns) ? userAns.join(', ') : userAns}</span>
                  </div>
                  <div class="p-2 bg-white rounded-lg border border-emerald-300 bg-emerald-50/30">
                    <span class="text-[10px] text-emerald-800 font-bold block uppercase tracking-wider">Kunci Jawaban Benar:</span>
                    <span class="text-sm font-black text-emerald-700 mt-0.5 block">${Array.isArray(q.kunci) ? q.kunci.join(', ') : q.kunci}</span>
                  </div>
                </div>
              </div>
            `;
          } else if (isCorrect) {
            qListHtml += `
              <div class="p-3 rounded-xl border border-slate-200 bg-white space-y-1 text-xs">
                <div class="flex items-center justify-between">
                  <div class="flex items-center gap-2 font-bold text-slate-800">
                    <span>Nomor ${q.nomor}</span>
                    <span class="text-[10px] px-1 bg-slate-100 rounded text-slate-500 uppercase">${q.tipe}</span>
                  </div>
                  <span class="text-[10px] font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200">✓ BENAR (+${q.bobot || 5})</span>
                </div>
                <div class="text-[11px] text-slate-600">
                  Jawaban: <span class="font-bold text-emerald-700">${Array.isArray(userAns) ? userAns.join(', ') : userAns}</span>
                </div>
              </div>
            `;
          } else {
            qListHtml += `
              <div class="p-3 rounded-xl border border-dashed border-amber-300 bg-amber-50/50 space-y-1 text-xs">
                <div class="flex items-center justify-between">
                  <span class="font-bold text-slate-800">Nomor ${q.nomor}</span>

                </div>
              </div>
            `;
          }

        modal.innerHTML = `
          <div class="bg-white w-full max-w-2xl rounded-2xl shadow-2xl border border-slate-100 p-6 space-y-4 my-8 max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-start pb-3 border-b border-slate-100">
              <div>
                <h3 class="font-bold text-slate-900 text-base">Hasil Koreksi & Analisis Jawaban Siswa</h3>
                <p class="text-xs text-slate-500">Tinjau lembar jawaban siswa dan identifikasi soal-soal yang keliru.</p>
              </div>
              <button onclick="closeDetailResultModal()" class="text-slate-400 hover:text-slate-600 text-lg font-bold">✕</button>

              </div>

            <!-- Filter Tabs Modal -->
            <div class="flex flex-wrap items-center gap-1.5 border-b border-slate-100 pb-2">
              <button onclick="window._changeDetailFilter('all')" class="px-3 py-1 text-xs font-bold rounded-lg transition ${currentFilter === 'all' ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                Semua Soal (${questions.length})
              </button>
              <button onclick="window._changeDetailFilter('wrong')" class="px-3 py-1 text-xs font-bold rounded-lg transition flex items-center gap-1 ${currentFilter === 'wrong' ? 'bg-rose-600 text-white' : 'bg-rose-50 text-rose-700 hover:bg-rose-100 border border-rose-200'}">
                <span>Jawaban Salah</span>
                <span class="px-1.5 py-0.2 bg-rose-200 text-rose-900 rounded-full text-[10px] font-black">${r.salah}</span>
              </button>
              <button onclick="window._changeDetailFilter('correct')" class="px-3 py-1 text-xs font-bold rounded-lg transition ${currentFilter === 'correct' ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                Benar (${r.benar})
              </button>
              ${r.kosong > 0 ? `
                <button onclick="window._changeDetailFilter('blank')" class="px-3 py-1 text-xs font-bold rounded-lg transition ${currentFilter === 'blank' ? 'bg-amber-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">

              ${qListHtml || '<div class="p-6 text-center text-slate-400 text-xs">Tidak ada soal dalam kategori ini.</div>'}

            <div class="pt-2 border-t border-slate-100 flex justify-end">
              <button onclick="closeDetailResultModal()" class="px-5 py-2 bg-slate-800 hover:bg-slate-900 text-white text-xs font-semibold rounded-xl transition">
                Tutup Analisis
              </button>
            </div>
          </div>
        `;
      }

      window._changeDetailFilter = function(f) {

      };

      renderModalContent(currentFilter);
      document.body.appendChild(modal);
    }

    // Export PDF Landscape Menggunakan jsPDF + AutoTable
    function exportResultsLandscapePDF() {
      if (typeof window.jspdf === 'undefined' || typeof window.jspdf.jsPDF === 'undefined') {
        showToast('Library jsPDF sedang dimuat. Mohon tunggu sejenak.', 'info');
        return;
      }

      var user = AppState.currentUser;
      var examFilter = AppState.resultsFilterExam || 'all';
      var myResults = AppState.results.filter(function(r) { return r.guruId === user.id; });
      var list = examFilter === 'all' ? myResults : myResults.filter(function(r) { return r.examId === examFilter; });

      if (list.length === 0) {
        showToast('Tidak ada data hasil ujian untuk diunduh.', 'warning');
        return;
      }

      var selectedExam = examFilter !== 'all' ? AppState.exams.find(function(e) { return e.id === examFilter; }) : null;

      var doc = new window.jspdf.jsPDF({
        orientation: 'landscape',
        unit: 'mm',
        format: 'a4'
      });

      var pageWidth = doc.internal.pageSize.getWidth(); // 297mm
      var margin = 14;
      var curY = 14;

      // Kop Sekolah Resmi
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(14);
      doc.setTextColor(15, 23, 42);
      doc.text(String(user.namaSekolah || 'LEMBAGA PENDIDIKAN').toUpperCase(), pageWidth / 2, curY, { align: 'center' });
      curY += 5;

      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9);
      doc.setTextColor(100, 116, 139);
      var subText = (user.alamatSekolah ? user.alamatSekolah + ' ' : '') + (user.teleponSekolah ? '• Telp: ' + user.teleponSekolah : '');
      if (subText) {
        doc.text(subText, pageWidth / 2, curY, { align: 'center' });
        curY += 4.5;
      }

      doc.setDrawColor(30, 41, 59);
      doc.setLineWidth(0.8);
      doc.line(margin, curY, pageWidth - margin, curY);
      curY += 5;

      // Judul Dokumen
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(12);
      doc.setTextColor(30, 58, 138);
      var reportTitle = 'REKAPITULASI HASIL KOREKSI UJIAN (OMR)';
      if (selectedExam) reportTitle += ' - ' + selectedExam.judul.toUpperCase();
      doc.text(reportTitle, margin, curY);
      curY += 4.5;

      doc.setFont('helvetica', 'normal');
      doc.setFontSize(8.5);
      doc.setTextColor(71, 85, 105);
      var metaStr = 'Guru Pengampu: ' + (user.nama || '-') + ' | Kelas: ' + (selectedExam ? selectedExam.kelas : 'Semua Kelas') + ' | Tanggal Cetak: ' + new Date().toLocaleDateString('id-ID');
      doc.text(metaStr, margin, curY);
      curY += 6;

      // Ringkasan Statistik
      var totalPeserta = list.length;
      var sumNilai = list.reduce(function(acc, item) { return acc + (item.nilai || 0); }, 0);
      var avgNilai = totalPeserta > 0 ? (sumNilai / totalPeserta).toFixed(1) : 0;
      var tuntasCount = list.filter(function(r) { return r.nilai >= 75; }).length;

      // Tabel Data
      var tableHeaders = [['No', 'ID Lembar', 'Nama Siswa', 'Mata Pelajaran & Ujian', 'Benar', 'Salah', 'Kosong', 'Nilai', 'Ketuntasan', 'Waktu Scan']];
      var tableRows = list.map(function(r, idx) {
        var isTuntas = r.nilai >= 75;
        return [
          idx + 1,
          r.sheetCode || '-',
          r.namaSiswa || 'Nama belum dikenali',
          (r.mapelNama || '-') + ' - ' + (r.examJudul || '-'),
          r.benar,
          r.salah,
          r.kosong,
          r.nilai,
          isTuntas ? 'TUNTAS' : 'REMEDIAL',
          r.waktuScan || '-'
        ];
      });

      doc.autoTable({
        head: tableHeaders,
        body: tableRows,
        startY: curY,
        margin: { left: margin, right: margin },
        theme: 'striped',
        headStyles: {
          fillColor: [30, 41, 59],
          textColor: [255, 255, 255],
          fontSize: 8,
          fontStyle: 'bold',
          halign: 'center'
        },
        styles: {
          fontSize: 7.5,
          cellPadding: 2,
          valign: 'middle'
        },
        columnStyles: {
          0: { halign: 'center', cellWidth: 10 },
          1: { halign: 'center', cellWidth: 26 },
          2: { cellWidth: 50 },
          3: { cellWidth: 55 },
          4: { halign: 'center', cellWidth: 14 },
          5: { halign: 'center', cellWidth: 14 },
          6: { halign: 'center', cellWidth: 14 },
          7: { halign: 'center', cellWidth: 16, fontStyle: 'bold' },
          8: { halign: 'center', cellWidth: 24, fontStyle: 'bold' },
          9: { halign: 'center', cellWidth: 35 }
        },
        didParseCell: function(data) {
          if (data.section === 'body' && data.column.index === 8) {
            if (data.cell.raw === 'TUNTAS') {
              data.cell.styles.textColor = [16, 149, 106];
            } else {
              data.cell.styles.textColor = [225, 29, 72];
            }
          }
        }
      });

      // Tanda Tangan
      var finalY = doc.lastAutoTable.finalY + 10;
      if (finalY > 175) {
        doc.addPage();
        finalY = 20;
      }

      var colLeftX = margin + 10;
      var colRightX = pageWidth - margin - 60;

      doc.setFontSize(8.5);
      doc.setFont('helvetica', 'normal');
      doc.setTextColor(30, 41, 59);

      doc.text('Mengetahui,', colLeftX, finalY);
      doc.text('Kepala Sekolah', colLeftX, finalY + 4);

      doc.text(user.namaSekolah || 'Sekolah', colRightX, finalY);
      doc.text('Guru Mata Pelajaran', colRightX, finalY + 4);

      finalY += 20;
      doc.setFont('helvetica', 'bold');
      doc.text('( ............................................ )', colLeftX, finalY);
      doc.text(user.nama || '( ............................................ )', colRightX, finalY);

      doc.save('Rekap_Nilai_OMR_Landscape_' + (selectedExam ? selectedExam.judul.replace(/[^a-zA-Z0-9]/g, '_') : 'Semua') + '.pdf');
    }

    // Export CSV Rapi dengan BOM UTF-8
    function exportResultsCSV() {
      var user = AppState.currentUser;
      var examFilter = AppState.resultsFilterExam || 'all';
      var myResults = AppState.results.filter(function(r) { return r.guruId === user.id; });
      var list = examFilter === 'all' ? myResults : myResults.filter(function(r) { return r.examId === examFilter; });

      if (list.length === 0) {
        showToast('Tidak ada data hasil untuk diekspor ke CSV.', 'warning');
        return;
      }

      var headers = ['No', 'ID Lembar', 'Nama Siswa', 'Mata Pelajaran', 'Ujian', 'Benar', 'Salah', 'Kosong', 'Nilai', 'Ketuntasan', 'Waktu Scan'];
      var rows = list.map(function(r, idx) {
        return [
          idx + 1,
          r.sheetCode || '-',
          '"' + (r.namaSiswa || 'Nama belum dikenali').replace(/"/g, '""') + '"',
          '"' + (r.mapelNama || '-').replace(/"/g, '""') + '"',
          '"' + (r.examJudul || '-').replace(/"/g, '""') + '"',
          r.benar,
          r.salah,
          r.kosong,
          r.nilai,
          r.nilai >= 75 ? 'TUNTAS' : 'REMEDIAL',
          r.waktuScan || '-'
        ];
      });

      var csvContent = '\uFEFF' + headers.join(',') + '\n' + rows.map(function(e) { return e.join(','); }).join('\n');
      var blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      var url = URL.createObjectURL(blob);
      var link = document.createElement('a');
      link.setAttribute('href', url);
      link.setAttribute('download', 'Rekap_Hasil_KORIX_OMR_' + new Date().toISOString().split('T')[0] + '.csv');
      document.body.appendChild(link);
      link.click();
      setTimeout(function() { document.body.removeChild(link); URL.revokeObjectURL(url); }, 200);
    }

    function saveStudentName(resultId) {
      var input = document.getElementById('input-edit-student-name');
      if (!input) return;
      var newName = input.value.trim() || 'Nama belum dikenali';
      var r = AppState.results.find(function(res) { return res.id === resultId; });
      if (r) {
        r.namaSiswa = newName;

    // ==========================================
    // CONTINUOUS CAMERA SCAN OMR
    // ==========================================
    function toggleCameraScan() {
      if (AppState.isScanning) {
        stopCamera();
      } else {
        startCamera();
      }
    }

    function startCamera() {
      var video = document.getElementById('omr-video');
      var placeholder = document.getElementById('camera-placeholder');
      var overlay = document.getElementById('camera-overlay');
      var btn = document.getElementById('btn-toggle-camera');

      navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
      }).then(function(stream) {
        AppState.videoStream = stream;
        AppState.isScanning = true;
        video.srcObject = stream;
        video.play();

        video.classList.remove('hidden');
        overlay.classList.remove('hidden');
        placeholder.classList.add('hidden');
        btn.innerText = '⏹️ Hentikan Kamera';
        btn.className = 'w-full py-2.5 bg-rose-600 hover:bg-rose-700 text-white font-semibold text-xs rounded-xl shadow-sm transition';

        AppState.scanInterval = setInterval(processCameraFrame, 800);
      }).catch(function(err) {
        showToast('Tidak dapat mengakses kamera: ' + (err.message || err), 'error');
      });
    }

    function stopCamera() {
      if (AppState.videoStream) {
        AppState.videoStream.getTracks().forEach(function(t) { t.stop(); });
        AppState.videoStream = null;
      }
      if (AppState.scanInterval) {
        clearInterval(AppState.scanInterval);
        AppState.scanInterval = null;
      }
      AppState.isScanning = false;

      var video = document.getElementById('omr-video');
      var placeholder = document.getElementById('camera-placeholder');
      var overlay = document.getElementById('camera-overlay');
      var btn = document.getElementById('btn-toggle-camera');

      if (video) video.classList.add('hidden');
      if (overlay) overlay.classList.add('hidden');
      if (placeholder) placeholder.classList.remove('hidden');
      if (btn) {
        btn.innerText = '▶️ Mulai Scan Kamera Berkelanjutan';
        btn.className = 'w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-xs rounded-xl shadow-sm transition';
      }
    }

    function processCameraFrame() {
      if (!AppState.isScanning) return;
      var video = document.getElementById('omr-video');
      var canvas = document.getElementById('omr-canvas');
      if (!video || !canvas || video.readyState !== video.HAVE_ENOUGH_DATA) return;

      var ctx = canvas.getContext('2d');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      var code = null;

      if (typeof jsQR !== 'undefined') {
        code = jsQR(imageData.data, imageData.width, imageData.height);
      }

      // Jika QR terbaca atau simulasi lembar diarahkan
      if (code && code.data && code.data !== AppState.lastScannedCode) {
        AppState.lastScannedCode = code.data;
        recordScanSuccess(code.data);
      }
    }

    function recordScanSuccess(qrText) {
      // Audio beeping feedback
      try {
        var audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        var osc = audioCtx.createOscillator();
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      } catch(e) {}

      var user = AppState.currentUser;
      var examSelect = document.getElementById('scan-select-exam');
      var examId = examSelect ? examSelect.value : (AppState.exams[0] ? AppState.exams[0].id : 'exam-01');
      var exam = AppState.exams.find(function(e) { return e.id === examId; }) || AppState.exams[0];

      // Kalkulasi nilai simulasi OMR
      var benar = Math.floor(Math.random() * 4) + 10;
      var salah = 15 - benar;
      var nilai = Math.round((benar / 15) * 100);

      var newRes = {
        id: 'res-' + new Date().getTime(),
        examId: examId,
        guruId: user.id,
        sheetCode: qrText || ('KORIX-EXAM-' + Math.floor(Math.random() * 900 + 100)),
        namaSiswa: 'Nama belum dikenali',
        mapelNama: exam ? exam.judul : 'Matematika Wajib',
        examJudul: exam ? exam.judul : 'Penilaian Harian',
        benar: benar,
        salah: salah,
        kosong: 0,
        nilai: nilai,
        waktuScan: new Date().toISOString().replace('T', ' ').substring(0, 19)
      };

      AppState.results.unshift(newRes);
      SafeStorage.setItem('korix_results', JSON.stringify(AppState.results));

      var statusBox = document.getElementById('last-scan-status');
      var scanCount = document.getElementById('scan-count');
      if (scanCount) scanCount.innerText = AppState.results.length;

      if (statusBox) {
        statusBox.innerHTML = `
          <div class="p-3 bg-emerald-50 border border-emerald-200 rounded-xl text-left space-y-1">
            <div class="text-xs font-bold text-emerald-800">✅ Berhasil Discan!</div>
            <div class="text-[11px] text-slate-700 font-mono">Kode Lembar: ${newRes.sheetCode}</div>
            <div class="text-xs font-semibold text-slate-800">Nilai: <span class="text-blue-600 font-bold text-sm">${newRes.nilai}</span> (Benar: ${newRes.benar}, Salah: ${newRes.salah})</div>
            <div class="text-[10px] text-slate-500">Siap untuk lembar berikutnya...</div>
          </div>
        `;
      }
    }
